spring.application.name=FoodieGo-Canteen-System

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/foodie_go?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Keeping these settings ready just in case)
jwt.secret=your_secret_key_that_is_a t_least_256_bits_long_for_hs512_algorithm_change_in_production_12345678
jwt.expiration=86400000
 
# Logging
logging.level.root=INFO
logging.level.com.foodiego.canteen=DEBUG
logging.level.org.springframework.security=DEBUG     