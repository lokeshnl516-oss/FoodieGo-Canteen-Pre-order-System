spring.application.name=FoodieGo-Canteen-System

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/canteen}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Keeping these settings ready just in case)
jwt.secret=your_secret_key_that_is_a t_least_256_bits_long_for_hs512_algorithm_change_in_production_12345678
jwt.expiration=86400000
 
# Logging
logging.level.root=INFO
logging.level.com.foodiego.canteen=DEBUG
logging.level.org.springframework.security=DEBUG     